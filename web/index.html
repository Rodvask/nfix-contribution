<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFI community telemetry</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>NFI · community telemetry</h1>
      <div class="sub" id="meta-line">cargando…</div>
    </div>
  </div>
  <div class="filters">
    <label>Días <select id="f-days">
      <option value="7">7</option><option value="30" selected>30</option><option value="90">90</option>
      <option value="365">365</option><option value="0">todo</option>
    </select></label>
    <label>Versión <select id="f-version"><option value="">todas</option></select></label>
    <label>Sistema <select id="f-system"><option value="">todos</option></select></label>
    <label>Lado <select id="f-side">
      <option value="">ambos</option><option value="long">long</option><option value="short">short</option>
    </select></label>
    <label>Exchange <select id="f-exchange"><option value="">todos</option></select></label>
    <label>Token <input id="f-token" type="password" autocomplete="off" placeholder="para detalle"></label>
    <button id="refresh">Actualizar</button>
  </div>
</header>

<nav id="tabs"></nav>

<main>
  <section id="view"><p class="muted">Cargando…</p></section>
</main>

<footer>
  <span id="foot-note">Datos agregados de instalaciones que envían el reporte diario anónimo. Ninguna clave, IP ni nombre de bot viaja ni se guarda.</span>
</footer>

<script src="app.js"></script>
</body>
</html>
